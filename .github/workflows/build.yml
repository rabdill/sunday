name: Build and publish

# The published site is rebuilt from committed files on every push. The authoring
# store does not exist here and is never needed (FR-007, SC-012) — CI proves the
# export boundary holds on every run.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      # No --strict: naming inconsistencies are editorial judgments and must never
      # block publication (FR-017a). They print as warnings and the site ships.
      - name: Build site
        run: sunday build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
