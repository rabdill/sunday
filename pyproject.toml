[project]
name = "sunday"
version = "0.1.0"
description = "A short fiction publishing system: a static site generator and a local authoring portal."
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
sunday = "sunday.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sunday*"]

[tool.setuptools.package-data]
sunday = ["templates/**/*.html", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
